name: Post-Deploy Smoke Test

on:
  push:
    branches:
      - main

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Wait for Cloudflare Pages build to start propagating
        run: sleep 60

      - name: Run smoke test against production (with retries)
        run: |
          MAX_ATTEMPTS=6
          DELAY=30
          for i in $(seq 1 $MAX_ATTEMPTS); do
            echo "Attempt $i of $MAX_ATTEMPTS"
            if node scripts/smoke-test.mjs "https://usenudua.com.ng"; then
              echo "Smoke test passed"
              exit 0
            fi
            echo "Smoke test failed — retrying in ${DELAY}s..."
            sleep $DELAY
          done
          echo "Smoke test failed after $MAX_ATTEMPTS attempts"
          exit 1
