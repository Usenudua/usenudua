name: Post-Deploy Smoke Test

on:
  deployment_status:

jobs:
  smoke-test:
    # Only run when Cloudflare Pages reports a successful deployment
    if: |
      github.event.deployment_status.state == 'success' &&
      contains(github.event.deployment_status.environment_url, 'usenudua')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run smoke test against deployment URL
        run: node scripts/smoke-test.mjs "${{ github.event.deployment_status.environment_url }}"
