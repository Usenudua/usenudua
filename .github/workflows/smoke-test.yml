name: Post-Deploy Smoke Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Determine target URL
        id: target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "url=https://usenudua.com.ng" >> "$GITHUB_OUTPUT"
          else
            PR_NUMBER="${{ github.event.pull_request.number }}"
            MAX_ATTEMPTS=10
            DELAY=20
            for i in $(seq 1 $MAX_ATTEMPTS); do
              echo "Looking for Cloudflare preview URL, attempt $i..."
              COMMENT_BODY=$(gh api "repos/${{ github.repository }}/issues/$PR_NUMBER/comments" \
                --jq '[.[] | select(.user.login == "cloudflare-workers-and-pages")] | last | .body // ""')
              PREVIEW_URL=$(echo "$COMMENT_BODY" | grep -oP '(?<=Branch Preview URL:\*\* )https://\S+' || \
                             echo "$COMMENT_BODY" | grep -oP 'https://[a-zA-Z0-9.-]+\.usenudua\.pages\.dev' | tail -1)
              if [ -n "$PREVIEW_URL" ]; then
                echo "Found: $PREVIEW_URL"
                echo "url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              sleep $DELAY
            done
            echo "Could not find Cloudflare preview URL after $MAX_ATTEMPTS attempts"
            exit 1
          fi

      - name: Wait for Cloudflare build (push only)
        if: github.event_name == 'push'
        run: sleep 60

      - name: Run smoke test (with retries)
        run: |
          MAX_ATTEMPTS=6
          DELAY=30
          for i in $(seq 1 $MAX_ATTEMPTS); do
            echo "Attempt $i of $MAX_ATTEMPTS against ${{ steps.target.outputs.url }}"
            if node scripts/smoke-test.mjs "${{ steps.target.outputs.url }}"; then
              echo "Smoke test passed"
              exit 0
            fi
            echo "Smoke test failed — retrying in ${DELAY}s..."
            sleep $DELAY
          done
          echo "Smoke test failed after $MAX_ATTEMPTS attempts"
          exit 1
